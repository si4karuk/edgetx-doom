name: Run tests and package firmware
on:
  workflow_dispatch:

jobs:
  build:
    name: Збірка прошивки
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - tx16s
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.8.0
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Патч сумісності заголовочних файлів
        run: |
          sed -i '1s/^/#include <cstdint>\n/' radio/src/gui/colorlcd/str_functions.h || true
          sed -i '1s/^/#include <cstdint>\n/' radio/src/gui/colorlcd/str_functions.cpp || true

      - name: Конфігурація та компіляція прошивки
        env:
          FLAVOR: ${{ matrix.target }}
        run: |
          git config --global --add safe.directory /__w/edgetx-doom/edgetx-doom
          ./tools/build-gh.sh
          cd build
          make -j$(nproc) firmware

      - name: Підготовка файлів та завантаження WAD
        run: |
          echo "artifact_name=doom_tx16s_fw" >> $GITHUB_ENV
          wget https://wadhosting.com/Wad/Download/5B2E249B9C5133EC987B3EA77596381DC0D6BC1D/DOOM1.WAD
          mkdir -p DOOM
          mv DOOM1.WAD DOOM/
          find build/ -name "*.bin" -exec cp {} ./ \;

      - name: Пакування готових артефактів для ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.artifact_name }}"
          path: |
            LICENSE
            *.bin
            DOOM
            README.md
          retention-days: 15
          if-no-files-found: error
