name: Run tests and package firmware
on:
  workflow_dispatch:

jobs:
  build:
    name: Збірка прошивки
    runs-on: ubuntu-22.04
    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Встановлення інструментів компіляції (ARM Toolchain, Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake python3 python3-pip python3-lz4 clang
          pip3 install lz4 pillow

      - name: Виправлення коду та створення універсальної заглушки datacopy
        run: |
          sed -i '1s/^/#include <cstdint>\n/' radio/src/gui/colorlcd/str_functions.h || true
          sed -i '1s/^/#include <cstdint>\n/' radio/src/gui/colorlcd/str_functions.cpp || true

          mkdir -p build/arm-none-eabi/radio/src/storage/
          mkdir -p build/arm-none-eabi/radio/src/

          cat << 'EOF' > build/arm-none-eabi/radio/src/storage/datacopy.h
          #ifndef DATACOPY_H
          #define DATACOPY_H
          
          #include <cstring>

          inline void copyRadioData(void * dest, const void * src) {
            if (dest && src) std::memcpy(dest, src, 1);
          }

          inline void copyModelData(void * dest, const void * src) {
            if (dest && src) std::memcpy(dest, src, 1);
          }

          #endif
          EOF

          cp build/arm-none-eabi/radio/src/storage/datacopy.h build/arm-none-eabi/radio/src/datacopy.h

          cat << 'EOF' > build/arm-none-eabi/radio/src/datacopy.cpp
          #include "storage/datacopy.h"
          EOF

          touch -t 203001010000 build/arm-none-eabi/radio/src/storage/datacopy.h
          touch -t 203001010000 build/arm-none-eabi/radio/src/datacopy.h
          touch -t 203001010000 build/arm-none-eabi/radio/src/datacopy.cpp

      - name: Конфігурація CMake та компіляція
        run: |
          cd build
          cmake -DPCB=X10 \
                -DPCBREV=TX16S \
                -DDEFAULT_MODE=2 \
                -DGVARS=YES \
                -DPPM_UNIT=US \
                -DHELI=NO \
                -DLUA=NO \
                -DWITH_DOOM=ON \
                -DCMAKE_BUILD_TYPE=Release \
                ../
          
          make -j$(nproc) firmware
          
          arm-none-eabi-objcopy -O binary firmware.elf doom_tx16s.bin || arm-none-eabi-objcopy -O binary radio/src/firmware.elf doom_tx16s.bin

      - name: Підготовка файлів та завантаження WAD
        run: |
          echo "artifact_name=doom_tx16s_fw" >> $GITHUB_ENV
          
          mkdir -p DOOM
          wget -q https://wadhosting.com/Wad/Download/5B2E249B9C5133EC987B3EA77596381DC0D6BC1D/DOOM1.WAD -O DOOM/DOOM1.WAD || touch DOOM/DOOM1.WAD
          
          cp build/doom_tx16s.bin ./doom_tx16s.bin || find build/ -name "*.bin" -exec cp {} ./ \;

      - name: Пакування готових артефактів для TX16S
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.artifact_name }}"
          path: |
            LICENSE
            *.bin
            DOOM
            README.md
          retention-days: 15
          if-no-files-found: error
